<h2 class="bg-primary text-white p-3">Suppliers</h2>

<div class="p-3">
  <mat-card class="mb-2 p-3 shadow-sm rounded">
    <mat-card-title class="mb-3">Filtros</mat-card-title>

    <form class="row g-1 mb-1" (ngSubmit)="applyFilter()">
      <div class="row">
        <div class="col-md-3">
          <mat-form-field class="w-100">
            <mat-label>Tax ID</mat-label>
            <input matInput [(ngModel)]="filters.taxId" name="taxId" />
          </mat-form-field>
        </div>

        <div class="col-md-3">
          <mat-form-field class="w-100">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="filters.name" name="name" />
          </mat-form-field>
        </div>

        <div class="col-md-3">
          <mat-form-field class="w-100">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="filters.email" name="email" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2">
        <button mat-raised-button color="primary" class="me-2">Buscar</button>
        <button
          mat-flat-button
          color="warn"
          type="button"
          (click)="clearFilters()"
        >
          Limpiar
        </button>
      </div>
    </form>
  </mat-card>

  <div *ngIf="loading" class="text-center p-3">Loading...</div>

  <div *ngIf="!loading">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="mat-elevation-z2 w-100 mt-3"
      *ngIf="dataSource.data.length"
    >
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let s">{{ s.id }}</td>
      </ng-container>

      <ng-container matColumnDef="taxId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tax ID</th>
        <td mat-cell *matCellDef="let s">{{ s.taxId }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let s">{{ s.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let s">{{ s.email }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>

    <mat-paginator
      [length]="totalItems"
      [pageIndex]="filters.page - 1"
      [pageSize]="filters.pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  </div>
</div>
